name: verify-883
on:
  push:
    branches: ['verify-883-*']
jobs:
  t:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - shell: bash
        run: for i in 1 2 3 4 5; do uv run --group test pytest tests/test_chef_integration.py -p no:warnings -v -k survives || exit 1; done
